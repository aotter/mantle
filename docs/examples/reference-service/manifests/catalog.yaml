# A small shop: a public catalog, orders that only their owner sees, and admin tools.
apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata: { name: items }
spec:
  title: Items
  lifecycle: operational
  schema:
    type: object
    required: [sku, name, stock]
    properties:
      sku: { type: string }
      name: { type: string }
      priceCents: { type: integer, minimum: 0 }
      stock: { type: integer, default: 0 }
  checks: ["stock >= 0"]
  uiSchema: { list: { primaryField: name, columns: [sku, stock] } }
  uniqueIndexes: [[sku]]
  indexes: [[name, id]]
  searchableFields: [name, sku]
---
apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata: { name: orders }
spec:
  title: Orders
  lifecycle: operational
  scope: { owner: auth.uid() }
  uiSchema: { list: { primaryField: itemId, columns: [qty, orderStatus] } }
  indexes: [[owner, createdAt, id]]
  schema:
    type: object
    required: [owner, itemId, qty, orderStatus]
    properties:
      owner: { type: string }
      itemId: { type: string }
      qty: { type: integer, minimum: 1 }
      orderStatus: { type: string, enum: [placed, cancelled] }
      placedAt: { type: string, format: date-time }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata: { name: activity }
spec:
  title: Activity
  lifecycle: operational
  indexes: [[createdAt, id]]
  schema:
    type: object
    required: [kind, subject]
    properties:
      kind: { type: string }
      subject: { type: string }
      detail: { type: string }
---
# Views are one SELECT; `input` is their parameters.
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: { name: catalog }
spec:
  surface: public
  sql: SELECT id, sku, name, priceCents AS "priceCents", stock FROM items ORDER BY name, id
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: { name: search-items }
spec:
  surface: internal
  input:
    type: object
    required: [q, afterRank, afterName, afterId, cap]
    properties:
      q: { type: string, minLength: 1 }
      afterRank: { type: [number, 'null'] }
      afterName: { type: [string, 'null'] }
      afterId: { type: [string, 'null'] }
      cap: { type: integer, minimum: 1, maximum: 501 }
  sql: |
    SELECT i.id, i.name, i.stock, mantle.search_rank(i) AS rank FROM items i
    WHERE mantle.search(i, input.q) AND (input.afterRank IS NULL
      OR mantle.search_rank(i) > input.afterRank
      OR (mantle.search_rank(i) = input.afterRank AND i.name > input.afterName)
      OR (mantle.search_rank(i) = input.afterRank AND i.name = input.afterName AND i.id > input.afterId))
    ORDER BY mantle.search_rank(i), i.name, i.id LIMIT input.cap
---
# Scope is injected into every Schema reference: this join only ever sees the caller's orders.
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: { name: my-orders }
spec:
  surface: public
  requires: { auth: { all: [ctx.user] } }
  sql: |
    SELECT o.id, o.qty, o.orderStatus AS "orderStatus", i.name AS item, o.version
    FROM orders o JOIN items i ON i.id = o.itemId
    ORDER BY o.created_at DESC, o.id DESC
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: { name: sales-by-item }
spec:
  surface: internal
  requires: { auth: { all: [{ ctx.admin: [admin] }] } }
  input:
    type: object
    required: [afterUnits, afterName, cap]
    properties:
      afterUnits: { type: [integer, 'null'] }
      afterName: { type: [string, 'null'] }
      cap: { type: integer, minimum: 1, maximum: 501 }
  sql: |
    SELECT i.name, count(o.id) AS orders, coalesce(sum(o.qty), 0) AS units
    FROM items i LEFT JOIN orders o ON o.itemId = i.id AND o.orderStatus = 'placed'
    GROUP BY i.name
    HAVING input.afterUnits IS NULL OR coalesce(sum(o.qty), 0) < input.afterUnits
      OR (coalesce(sum(o.qty), 0) = input.afterUnits AND i.name > input.afterName)
    ORDER BY units DESC, i.name LIMIT input.cap
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: { name: recent-activity }
spec:
  surface: admin
  requires: { auth: { all: [{ ctx.admin: [admin] }] } }
  sql: SELECT kind, subject, detail FROM activity ORDER BY created_at DESC, id DESC LIMIT 50

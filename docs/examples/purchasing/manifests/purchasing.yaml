# Internal purchase requests: employees submit, admins approve or reject, approval spends a department budget.
# requestStatus: submitted -> approved -> ordered -> confirmed, or submitted -> rejected.
apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata: { name: budgets }
spec:
  title: Budgets
  lifecycle: operational
  uniqueIndexes: [[department]]
  # An approval that would overspend fails this check and the whole approval rolls back.
  checks: ["remaining >= 0"]
  searchableFields: [department]
  uiSchema: { list: { primaryField: department, columns: [remaining] } }
  schema:
    type: object
    additionalProperties: false
    required: [department, remaining]
    properties:
      department: { type: string }
      remaining: { type: integer }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata: { name: requests }
spec:
  title: Purchase requests
  lifecycle: operational
  indexes: [[authorId, createdAt, id], [requestStatus, createdAt, id]]
  searchableFields: [title, department]
  # Sidebar: in the Approvals group (src/admin.tsx), after the queue of requests waiting for a decision.
  uiSchema: { list: { primaryField: title, columns: [department, amount, requestStatus], filterField: requestStatus }, nav: { group: approvals, order: 2 } }
  schema:
    type: object
    # Admin reads requests but cannot edit them generically: a generic edit could move requestStatus back to
    # 'submitted' and spend the budget twice. Every change goes through the guarded Procedures below.
    readOnly: true
    additionalProperties: false
    required: [title, amount, department, requestStatus]
    properties:
      title: { type: string, minLength: 1 }
      amount: { type: integer, minimum: 1 }
      department: { type: string }
      requestStatus: { type: string, enum: [submitted, approved, rejected, ordered, confirmed] }
      supplierOrderId: { type: string }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata: { name: ledger }
spec:
  title: Budget ledger
  lifecycle: operational
  indexes: [[createdAt, id]]
  # One row per spending request.
  uniqueIndexes: [[requestId]]
  searchableFields: [department]
  uiSchema: { list: { primaryField: department, columns: [amount, remainingAfter, requestId] } }
  schema:
    type: object
    readOnly: true # written only by approve-request-write and submit-request
    additionalProperties: false
    required: [requestId, department, amount, remainingAfter]
    properties:
      requestId: { type: string }
      department: { type: string }
      amount: { type: integer }
      remainingAfter: { type: integer }
---
# Employees see only the requests they submitted.
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: { name: my-requests }
spec:
  surface: public
  requires: { auth: { all: [ctx.user] } }
  restrict: { requests: "author_id = auth.uid()" }
  sql: |
    SELECT id, title, amount, department, requestStatus AS "requestStatus", version
    FROM requests ORDER BY created_at DESC, id DESC
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: { name: pending-requests }
spec:
  title: Pending purchase requests
  surface: admin
  requires: { auth: { all: [ctx.admin] } }
  uiSchema: { nav: { group: approvals, order: 1 } }
  sql: |
    SELECT id, title, amount, department, version
    FROM requests WHERE requestStatus = 'submitted' ORDER BY created_at, id
---
# The daily reminder reads this from src/schedule.ts; no route or tool exposes it.
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: { name: stale-requests }
spec:
  surface: internal
  input:
    type: object
    additionalProperties: false
    required: [before]
    properties:
      before: { type: string, format: date-time }
  sql: |
    SELECT id, title, amount, department FROM requests
    WHERE requestStatus = 'submitted' AND created_at < input.before
    ORDER BY created_at, id LIMIT 100
---
# Approved but not yet ordered (the supplier call failed): the cron retries these.
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: { name: approved-requests }
spec:
  surface: internal
  sql: |
    SELECT id, title, amount FROM requests WHERE requestStatus = 'approved'
    ORDER BY created_at, id LIMIT 20
---
# Selecting from budgets refuses a department that has no budget, so approval always has a budget row to deduct.
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: submit-request }
spec:
  title: Submit a purchase request
  description: Submit a purchase request against an existing department budget; a request of 100 or less is approved at once and spends the budget.
  requires: { auth: { all: [ctx.user] } }
  input:
    type: object
    additionalProperties: false
    required: [title, amount, department]
    properties:
      title: { type: string, minLength: 1 }
      amount: { type: integer, minimum: 1 }
      department: { type: string }
  output: { type: object }
  # One program. CASE picks the status: up to 100 is approved now, more waits for an admin. The budget and ledger
  # statements then act only on "the request this program approved": the caller's, created by this program
  # (created_at = now(), the same instant Mantle writes into created_at), approved, and with no ledger row yet. So the
  # threshold lives only in the CASE, and remaining >= 0 refuses all three statements when a small request would
  # overspend. A pending request matches nothing there, which a set form (IN (SELECT ...), INSERT ... SELECT) allows.
  handler:
    sql: |
      INSERT INTO requests (title, amount, department, requestStatus)
      SELECT input.title, input.amount, b.department, CASE WHEN input.amount <= 100 THEN 'approved' ELSE 'submitted' END
      FROM budgets b WHERE b.department = input.department
      RETURNING id, version, requestStatus AS "requestStatus";
      UPDATE budgets SET remaining = remaining - (SELECT SUM(r.amount) FROM requests r WHERE r.department = budgets.department
          AND r.author_id = auth.uid() AND r.created_at = now() AND r.requestStatus = 'approved'
          AND NOT EXISTS (SELECT 1 FROM ledger l WHERE l.requestId = r.id))
      WHERE department IN (SELECT r.department FROM requests r WHERE r.author_id = auth.uid() AND r.created_at = now()
          AND r.requestStatus = 'approved' AND NOT EXISTS (SELECT 1 FROM ledger l WHERE l.requestId = r.id));
      INSERT INTO ledger (requestId, department, amount, remainingAfter)
      SELECT r.id, r.department, r.amount, b.remaining FROM requests r JOIN budgets b ON b.department = r.department
      WHERE r.author_id = auth.uid() AND r.created_at = now() AND r.requestStatus = 'approved'
        AND NOT EXISTS (SELECT 1 FROM ledger l WHERE l.requestId = r.id)
---
# The requester may change the amount while the request is still 'submitted'. The version moves on, so an admin
# approving the version they reviewed before the change gets a 409 and looks again.
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: change-amount }
spec:
  title: Change the amount of my request
  description: Change the amount of the signed-in member's submitted purchase request.
  requires: { auth: { all: [ctx.user] } }
  restrict: { requests: "author_id = auth.uid()" }
  input:
    type: object
    additionalProperties: false
    required: [id, expectedVersion, amount]
    properties:
      id: { type: string }
      expectedVersion: { type: integer }
      amount: { type: integer, minimum: 1 }
  output: { type: object }
  handler:
    sql: |
      UPDATE requests SET amount = input.amount
      WHERE id = input.id AND version = input.expectedVersion AND requestStatus = 'submitted'
      RETURNING id, version
---
# Admin-only. The ref handler runs the write below, then places the supplier order and emails the requester.
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: approve-request }
spec:
  title: Approve a purchase request
  description: Approve a submitted request; deducts the department budget, records a ledger row and places the supplier order.
  requires: { auth: { all: [ctx.admin] } }
  target: { schema: requests, id: id, version: expectedVersion }
  input:
    type: object
    additionalProperties: false
    required: [id, expectedVersion]
    properties:
      id: { type: string }
      expectedVersion: { type: integer }
  output: { type: object }
  handler: { ref: approve-request }
---
# One program, one transaction. Statement 1 is the guarded transition: a stale version or a request that is no longer
# 'submitted' matches 0 rows -> CONFLICT (409). Statement 2 fails remaining >= 0 when over budget. Either failure rolls
# back all three statements.
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: approve-request-write }
spec:
  requires: { auth: { all: [ctx.admin] } }
  input:
    type: object
    additionalProperties: false
    required: [id, expectedVersion]
    properties:
      id: { type: string }
      expectedVersion: { type: integer }
  output: { type: object }
  handler:
    sql: |
      UPDATE requests SET requestStatus = 'approved'
      WHERE id = input.id AND version = input.expectedVersion AND requestStatus = 'submitted'
      RETURNING id, title, amount, author_id AS "authorId";
      UPDATE budgets SET remaining = remaining - (SELECT r.amount FROM requests r WHERE r.id = input.id)
      WHERE department = (SELECT r.department FROM requests r WHERE r.id = input.id);
      INSERT INTO ledger (requestId, department, amount, remainingAfter)
      SELECT r.id, r.department, r.amount, b.remaining FROM requests r JOIN budgets b ON b.department = r.department
      WHERE r.id = input.id
---
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: reject-request }
spec:
  title: Reject a purchase request
  requires: { auth: { all: [ctx.admin] } }
  target: { schema: requests, id: id, version: expectedVersion }
  input:
    type: object
    additionalProperties: false
    required: [id, expectedVersion]
    properties:
      id: { type: string }
      expectedVersion: { type: integer }
  output: { type: object }
  handler: { ref: reject-request }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: reject-request-write }
spec:
  requires: { auth: { all: [ctx.admin] } }
  input:
    type: object
    additionalProperties: false
    required: [id, expectedVersion]
    properties:
      id: { type: string }
      expectedVersion: { type: integer }
  output: { type: object }
  handler:
    sql: |
      UPDATE requests SET requestStatus = 'rejected'
      WHERE id = input.id AND version = input.expectedVersion AND requestStatus = 'submitted'
      RETURNING id, title, author_id AS "authorId"
---
# Called after the supplier accepted the order: by the approve handler (admin caller) and by the cron retry (system
# caller). System callers satisfy no `requires` predicate, so it has none; no Trigger exposes it.
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: mark-ordered }
spec:
  input:
    type: object
    additionalProperties: false
    required: [id, supplierOrderId]
    properties:
      id: { type: string }
      supplierOrderId: { type: string }
  output: { type: object }
  handler:
    sql: |
      UPDATE requests SET requestStatus = 'ordered', supplierOrderId = input.supplierOrderId
      WHERE id = input.id AND requestStatus = 'approved'
      RETURNING id
---
# Called only by POST /callbacks/supplier (src/routes.ts) as a system caller after the signature checks out.
# The callback can arrive before mark-ordered ran, so 'approved' is accepted too.
# No Trigger exposes it; system callers satisfy no `requires` predicate, so it has none.
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: confirm-order }
spec:
  input:
    type: object
    additionalProperties: false
    required: [id, supplierOrderId]
    properties:
      id: { type: string }
      supplierOrderId: { type: string }
  output: { type: object }
  handler:
    sql: |
      UPDATE requests SET requestStatus = 'confirmed', supplierOrderId = input.supplierOrderId
      WHERE id = input.id AND (
        (requestStatus = 'ordered' AND supplierOrderId = input.supplierOrderId)
        OR requestStatus = 'approved')
      RETURNING id
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: submit-request-http }
spec:
  source: { kind: http, method: POST, path: /api/requests }
  target: { procedure: submit-request }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: submit-request-mcp }
spec:
  source: { kind: mcp, surface: public }
  target: { procedure: submit-request }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: change-amount-http }
spec:
  source: { kind: http, method: POST, path: '/api/requests/{id}/amount' }
  target: { procedure: change-amount }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: change-amount-mcp }
spec:
  source: { kind: mcp, surface: public }
  target: { procedure: change-amount }
---
# Admin MCP tools: an AI agent connected to /mcp/admin can approve or reject.
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: approve-request-mcp }
spec:
  source: { kind: mcp, surface: admin }
  target: { procedure: approve-request }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: reject-request-mcp }
spec:
  source: { kind: mcp, surface: admin }
  target: { procedure: reject-request }
---
# Admins open a department's budget from the Budgets list header (operational collections have no generic create);
# adjusting `remaining` later is an ordinary Admin edit.
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: open-budget }
spec:
  title: Open a budget
  description: Give a department a purchasing budget.
  requires: { auth: { all: [ctx.admin] } }
  uiSchema: { collectionAction: budgets }
  input:
    type: object
    required: [department, remaining]
    additionalProperties: false
    properties:
      department: { type: string, minLength: 1, maxLength: 100, title: Department }
      remaining: { type: integer, minimum: 0, title: Budget }
  output: { type: object }
  handler:
    sql: |
      INSERT INTO budgets (department, remaining) VALUES (input.department, input.remaining) RETURNING id
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: open-budget-admin }
spec:
  source: { kind: mcp, surface: admin }
  target: { procedure: open-budget }

apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata: {name: orders}
spec:
  title: Orders
  lifecycle: operational
  indexes: [[region]]
  schema:
    type: object
    required: [region, tier, title]
    properties: {region: {type: string}, tier: {type: string}, title: {type: string}}
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: {name: regional-orders}
spec:
  title: Orders in my regions
  description: Orders whose region is one of the caller's regions.
  surface: admin
  requires: {auth: {all: [ctx.admin]}}
  restrict: {orders: "region IN auth.user('region')"}
  sql: SELECT id, title, region FROM orders ORDER BY id
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: {name: tier-orders}
spec:
  title: Orders of my tier
  surface: internal
  restrict: {orders: "tier IN auth.user('tier')"}
  sql: SELECT id, title, tier FROM orders ORDER BY title, id
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: {name: all-orders}
spec:
  title: Every order
  surface: internal
  sql: SELECT id, title, region FROM orders ORDER BY title, id
---
apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata: {name: notes}
spec:
  title: Regional notes
  lifecycle: operational
  scope: "area IN auth.user('region')"
  indexes: [[area]]
  schema:
    type: object
    required: [area, title]
    properties: {area: {type: string}, title: {type: string}}
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: {name: notes-list}
spec:
  title: Notes I can see
  surface: admin
  requires: {auth: {all: [ctx.admin]}}
  sql: SELECT id, title FROM notes ORDER BY id
---
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: {name: rename-order}
spec:
  title: Rename an order
  requires: {auth: {all: [ctx.admin]}}
  input: {type: object, required: [id, title], properties: {id: {type: string}, title: {type: string, minLength: 1}}, additionalProperties: false}
  output: {type: object}
  restrict: {orders: "region IN auth.user('region')"}
  handler: {sql: "UPDATE orders SET title = input.title WHERE id = input.id RETURNING id, title"}
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: {name: rename-order-http}
spec: {source: {kind: http, method: POST, path: /api/orders/rename}, target: {procedure: rename-order}}
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: {name: rename-order-mcp}
spec: {source: {kind: mcp, surface: admin}, target: {procedure: rename-order}}
---
# OR between restrict terms (ADR-0046, #2105): a document is visible to its creator or to an owner of its organization.
apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata: {name: docs}
spec:
  title: Documents
  lifecycle: operational
  indexes: [[org, title, id], [title, id]]
  schema:
    type: object
    required: [org, title]
    properties: {org: {type: string}, title: {type: string}}
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: {name: my-docs}
spec:
  title: Documents I created or whose organization I own
  surface: public
  restrict: {docs: "author_id = auth.uid() OR org IN auth.user('ownerOrgIds')"}
  sql: SELECT id, title, org FROM docs ORDER BY title, id
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: {name: my-doc}
spec:
  title: One document I created or whose organization I own
  surface: public
  input: {type: object, required: [id], properties: {id: {type: string}}}
  restrict: {docs: "author_id = auth.uid() OR org IN auth.user('ownerOrgIds')"}
  sql: SELECT id, title FROM docs WHERE id = input.id ORDER BY id
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: {name: member-docs}
spec:
  title: My documents in organizations I belong to, or any document of an organization I own
  surface: internal
  restrict: {docs: "org IN auth.user('orgIds') AND author_id = auth.uid() OR org IN auth.user('ownerOrgIds')"}
  sql: SELECT id, title FROM docs ORDER BY title, id
---
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: {name: rename-doc}
spec:
  title: Rename a document
  input: {type: object, required: [id, title], properties: {id: {type: string}, title: {type: string, minLength: 1}}, additionalProperties: false}
  output: {type: object}
  restrict: {docs: "(author_id = auth.uid() OR org IN auth.user('ownerOrgIds'))"}
  handler: {sql: "UPDATE docs SET title = input.title WHERE id = input.id RETURNING id, title"}
---
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: {name: delete-doc}
spec:
  title: Delete a document
  input: {type: object, required: [id], properties: {id: {type: string}}, additionalProperties: false}
  output: {type: object}
  restrict: {docs: "author_id = auth.uid() OR org IN auth.user('ownerOrgIds')"}
  handler: {sql: "DELETE FROM docs WHERE id = input.id RETURNING id"}

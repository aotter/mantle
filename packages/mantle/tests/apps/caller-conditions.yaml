# Targets for the authorize example in docs/handbook/reference/authorization.md#caller-conditions.
apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata: { name: notes }
spec:
  title: Notes
  lifecycle: operational
  scope: "owner = auth.uid()"
  indexes: [[owner, id]]
  schema:
    type: object
    required: [owner, body]
    properties:
      owner: { type: string }
      body: { type: string }
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata: { name: my-notes }
spec:
  surface: public
  requires: { auth: { all: [ctx.user] } }
  sql: SELECT id, body FROM notes ORDER BY id
---
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: add-note }
spec:
  requires: { auth: { all: [ctx.user] } }
  input: { type: object, additionalProperties: false, required: [body], properties: { body: { type: string } } }
  output: { type: object }
  handler: { sql: INSERT INTO notes (body) VALUES (input.body) RETURNING id }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata: { name: delete-workspace }
spec:
  requires: { auth: { all: [ctx.user] } }
  input: { type: object, additionalProperties: false, properties: {} }
  output: { type: object }
  handler: { sql: DELETE FROM notes WHERE body IS NOT NULL RETURNING id }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: add-note-http }
spec: { source: { kind: http, method: POST, path: /api/notes }, target: { procedure: add-note } }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: add-note-mcp }
spec: { source: { kind: mcp, surface: public }, target: { procedure: add-note } }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: delete-workspace-http }
spec: { source: { kind: http, method: POST, path: /api/workspace/delete }, target: { procedure: delete-workspace } }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata: { name: delete-workspace-mcp }
spec: { source: { kind: mcp, surface: public }, target: { procedure: delete-workspace } }

# Characterization source for ADR-0019. It deliberately uses an alias,
# an empty document, every v0.1 atom, every Trigger surface, auth, and a guard.
apiVersion: cms.mantle.aotter.net/v2
kind: Schema
metadata:
  name: orders
spec:
  title: Orders
  schema:
    type: object
    required: [customerId, orderStatus]
    properties:
      customerId: &identifier { type: string, minLength: 1 }
      externalId: *identifier
      orderStatus: { type: string, enum: [open, closed] }
      placedAt: { type: number, x-mantle-bind: now }
  indexes: [[customerId]]
---
# Empty documents are ignored but count toward diagnostic document indexes.
---
apiVersion: cms.mantle.aotter.net/v2
kind: View
metadata:
  name: open-orders
spec:
  surface: public
  input:
    type: object
    required: [customerId]
    properties:
      customerId: { type: string }
  select:
    from: orders
    columns: [id, customerId, orderStatus, placedAt]
    where:
      and:
        - customerId: $input.customerId
        - orderStatus: open
    orderBy: { placedAt: desc }
    limit: 20
  requires:
    auth:
      all: [ctx.auth, ctx.user]
    guard: { procedure: authorize-order }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata:
  name: authorize-order
spec:
  input:
    type: object
    required: [customerId]
    properties:
      customerId: { type: string }
  output: { type: object }
  handler: { ref: authorizeOrder }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Procedure
metadata:
  name: place-order
spec:
  input:
    type: object
    required: [customerId]
    properties:
      customerId: { type: string }
  output: { type: object }
  handler: { ref: placeOrder }
  requires:
    auth:
      all: [ctx.auth, ctx.user]
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata:
  name: place-order-http
spec:
  source: { kind: http, method: POST, path: /api/orders }
  target: { procedure: place-order }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata:
  name: place-order-mcp
spec:
  source: { kind: mcp, surface: public }
  target: { procedure: place-order }
---
apiVersion: cms.mantle.aotter.net/v2
kind: Trigger
metadata:
  name: order-created
spec:
  source:
    kind: lifecycle
    schema: orders
    on: [after_create]
  target: { procedure: place-order }

name = "mantle-store-sql-spike"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"

# Local D1 only. The id is a placeholder: `unstable_startWorker` with `persist: false` never
# talks to Cloudflare, and nothing in this spike creates or touches a remote resource.
[[d1_databases]]
binding = "DB"
database_name = "spike"
database_id = "00000000-0000-0000-0000-000000000000"

# Single release controller for aotter/mantle#559.
#
# Manually dispatched from the merged release commit. It owns the order:
#
#   source + exact packed consumer -> Core tag -> verified candidate registries ->
#   public-registry consumer -> public channels -> release
#
# Duplicate dispatches verify the same immutable state and skip existing
# registry/tag/release mutations. No downstream repository is mutated.
#
# Publish attaches the internal candidate dist-tag mantle-release. That tag
# is an intentional leftover pointing at the last published candidate and is
# not cleared. Consumers must not install it. Official channels are only
# alpha, beta, rc, and latest.
#
# If v$VERSION already points at an ancestor of the dispatched tip and
# package versions on the tip still match, Resolve keeps that tag SHA as
# the release identity. A controller-only fix on the tip can finish
# promotion without retagging. Tagged recovery skips the Core source
# check because that tree was already released from the immutable tag.
# When that tag exists and every npmjs package at the version is already
# published, skip pack and immutable tarball compare. The controller tip
# must not rebuild published artifact identity.
#
# npmjs authentication is npm trusted publishing (OIDC). The repository holds
# no npm token. npmjs.com trusts this workflow file (release.yml) running in
# the GitHub environment npm-publish, for `npm publish` and `npm dist-tag`;
# docs/release-process.md lists the one-time setup per package.
#
# The order above is one chain of jobs, each needing the one before it:
#
#   prepare  -> source gates, pack; tarballs travel as a run artifact
#   publish  -> preflight, Core tag, npmjs publish, npmjs verification  (OIDC)
#   mirror   -> GitHub Packages
#   consumer -> public-registry reference Worker
#   promote  -> npmjs channel dist-tags                                 (OIDC)
#   release  -> GitHub Packages channel dist-tags, GitHub release
#
# Every step of a job that holds `id-token: write` can mint the identity
# npmjs trusts. The two OIDC jobs therefore install no dependencies and run
# no package code: only npm itself and the dependency-free scripts
# scripts/verify-release-artifact.mjs and scripts/release-tag-order.mjs.
# Dependency installs, tests and the Worker gate stay in jobs without it.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v'
        required: true
        type: string

concurrency:
  group: release-controller
  cancel-in-progress: false

# Each job states the permissions it needs.
permissions: {}

env:
  # npm that the OIDC jobs install, exact. Trusted publishing needs
  # npm >= 11.5.1 for `npm publish` and >= 11.21.0 for `npm dist-tag`, on
  # Node >= 22.14.0. Node 22 bundles npm 10, and Node 24 bundled less than
  # 11.21.0 as late as 24.22.2, so a Node version alone does not pin it.
  OIDC_NPM_VERSION: 11.21.2

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      core_sha: ${{ steps.ver.outputs.core_sha }}
      tag_exists: ${{ steps.ver.outputs.tag_exists }}
      npm_tag: ${{ steps.ver.outputs.npm_tag }}
      pkg_names: ${{ steps.pkgs.outputs.names }}
      published: ${{ steps.pkgs.outputs.published }}
    # Check Core source runs the PostgreSQL dialect's tests and four-target native conformance against this server, as CI does;
    # without MANTLE_PG_URL they would skip and the release would gate less than a PR.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: mantle, POSTGRES_PASSWORD: mantle, POSTGRES_DB: mantle }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    # Single source of truth for the three public packages, in dependency order.
    # Names are read from these package.json files during packing and reach
    # the later jobs as the pkg_names output.
    env:
      PKG_DIRS: >-
        packages/mantle-ui
        packages/mantle
        packages/mantle-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release state
        id: ver
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || {
            echo "::error::Invalid version: $VERSION"
            exit 1
          }
          TAG="v$VERSION"
          HEAD_SHA=$(git rev-parse HEAD)
          CORE_SHA=$HEAD_SHA
          SOURCE_BRANCH=main
          [[ "$VERSION" =~ -alpha(\.|$) ]] && SOURCE_BRANCH=develop
          git fetch origin --tags
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          # Partial-release recovery. The version tag already owns the release
          # SHA; this tip only carries controller fixes. Do not retag.
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            ROOT_VERSION=$(node -p "require('./package.json').version")
            [ "$ROOT_VERSION" = "$VERSION" ] || {
              echo "::error::Root package.json version $ROOT_VERSION does not match $VERSION"
              exit 1
            }
            git merge-base --is-ancestor "$TAG_SHA" "$HEAD_SHA" || {
              echo "::error::$TAG at $TAG_SHA is not an ancestor of controller tip $HEAD_SHA"
              exit 1
            }
            node --input-type=module -e "
              import { globSync, readFileSync } from 'node:fs';
              const expected = process.env.VERSION;
              let failed = false;
              for (const path of globSync('packages/**/package.json', {
                exclude: ['packages/**/node_modules/**'],
              })) {
                const pkg = JSON.parse(readFileSync(path, 'utf8'));
                if (pkg.version !== expected) {
                  console.error('::error::' + path + ' version ' + pkg.version + ' does not match tagged version ' + expected);
                  failed = true;
                }
              }
              if (failed) process.exit(1);
            "
            echo "::warning::Recovering $TAG: tag owns the release SHA $TAG_SHA; tip $HEAD_SHA only carries controller fixes"
            CORE_SHA=$TAG_SHA
          fi
          if [ -z "$TAG_SHA" ]; then
            git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
            SOURCE_SHA=$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")
            [ "$CORE_SHA" = "$SOURCE_SHA" ] || {
              echo "::error::Untagged release commit $CORE_SHA is not the current $SOURCE_BRANCH tip $SOURCE_SHA"
              exit 1
            }
          fi
          PULLS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CORE_SHA/pulls")
          MERGED_PR_COUNT=$(jq \
            --arg base "$SOURCE_BRANCH" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$CORE_SHA" \
            '[.[] | select(.merged_at != null and .base.ref == $base and .head.repo.full_name == $repo and .merge_commit_sha == $sha)] | length' \
            <<< "$PULLS")
          [ "$MERGED_PR_COUNT" = 1 ] || {
            echo "::error::Release commit $CORE_SHA is not one canonical merged PR commit on $SOURCE_BRANCH"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "core_sha=$CORE_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG_SHA" ]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          CHANNELS=$(node scripts/release-tag-order.mjs --channels "$VERSION")
          NPM_TAG=${CHANNELS%% *}
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.ver.outputs.tag_exists != 'true'
        with:
          bun-version: 1.3.14

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Core source
        if: steps.ver.outputs.tag_exists != 'true'
        run: pnpm check
        env:
          MANTLE_PG_URL: postgres://mantle:mantle@localhost:5432/mantle
          MANTLE_NEXT_BUN_PG_URL: postgres://mantle:mantle@localhost:5432/mantle
          MANTLE_NEXT_WORKER_PG_URL: postgres://mantle:mantle@localhost:5432/mantle

      # the examples' MCP App compatibility test (npm test) runs in Chrome
      - name: Install Chrome
        if: steps.ver.outputs.tag_exists != 'true'
        run: pnpm --filter @aotter/mantle-admin exec playwright install --with-deps chrome

      - name: Fresh copies of packaged examples (npm and pnpm 10)
        if: steps.ver.outputs.tag_exists != 'true'
        run: node scripts/check-examples.mjs --fresh
        env:
          MANTLE_TEST_CHROMIUM: /usr/bin/google-chrome

      - name: mantle init app installs without high or critical advisories
        if: steps.ver.outputs.tag_exists != 'true'
        run: node scripts/check-init-audit.mjs

      - name: Admin build under npm ci --ignore-scripts, served without node_modules
        if: steps.ver.outputs.tag_exists != 'true'
        run: node scripts/check-admin-build.mjs

      - name: Check native hosts
        if: steps.ver.outputs.tag_exists != 'true'
        run: pnpm --filter @aotter/mantle test:native
        env:
          MANTLE_PG_URL: postgres://mantle:mantle@localhost:5432/mantle
          MANTLE_NEXT_BUN_PG_URL: postgres://mantle:mantle@localhost:5432/mantle
          MANTLE_NEXT_WORKER_PG_URL: postgres://mantle:mantle@localhost:5432/mantle

      - name: Verify package, plugin, and marketplace versions match ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { globSync, readFileSync } from 'node:fs';
            const expected = '${{ steps.ver.outputs.version }}';
            let failed = false;
            const packagePaths = [
              'package.json',
              ...globSync('packages/**/package.json', {
                exclude: ['packages/**/node_modules/**'],
              }),
            ];
            for (const path of packagePaths) {
              const pkg = JSON.parse(readFileSync(path, 'utf8'));
              if (pkg.version !== expected) {
                console.error(path + ' version ' + pkg.version + ' does not match tag version ' + expected);
                failed = true;
              }
            }
            for (const path of [
              '.codex-plugin/plugin.json',
              '.claude-plugin/plugin.json',
              '.copilot-plugin/plugin.json',
              '.cursor-plugin/plugin.json',
            ]) {
              const plugin = JSON.parse(readFileSync(path, 'utf8'));
              if (plugin.version !== expected) {
                console.error(path + ' version ' + plugin.version + ' does not match tag version ' + expected);
                failed = true;
              }
            }
            if (failed) process.exit(1);
          "

      - name: Record published packages
        id: pkgs
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG_EXISTS: ${{ steps.ver.outputs.tag_exists }}
        run: |
          set -euo pipefail
          PKG_NAMES=""
          for dir in $PKG_DIRS; do
            name=$(node -p "require('./$dir/package.json').name")
            PKG_NAMES="${PKG_NAMES:+$PKG_NAMES }$name"
          done
          [ -n "$PKG_NAMES" ] || {
            echo "::error::No public packages resolved"
            exit 1
          }
          echo "PKG_NAMES=$PKG_NAMES" >> "$GITHUB_ENV"
          echo "names=$PKG_NAMES" >> "$GITHUB_OUTPUT"
          published=false
          if [ "$TAG_EXISTS" = true ]; then
            missing=0
            for pkg in $PKG_NAMES; do
              npm view "$pkg@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1 || missing=1
            done
            if [ "$missing" = 0 ]; then
              published=true
              echo "Tagged recovery: all packages already exist on npmjs at $VERSION."
            fi
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Pack release tarballs
        if: steps.pkgs.outputs.published != 'true'
        run: |
          set -euo pipefail
          node scripts/verify-release-artifact.mjs --self-test
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p .release-tarballs
          for dir in $PKG_DIRS; do
            pnpm -C "$dir" pack --pack-destination "$PWD/.release-tarballs"
          done

          # Version lockstep: pnpm pack names tarballs <name>-<version>.tgz,
          # so a package whose version drifted from the tag fails here.
          for pkg in $PKG_NAMES; do
            base="${pkg#@}"
            test -f ".release-tarballs/${base//\//-}-$VERSION.tgz"
          done

      - name: Upload release tarballs
        if: steps.pkgs.outputs.published != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: .release-tarballs/
          # .release-tarballs is a dot directory, which the action skips by default
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # OIDC job. Nothing here may install dependencies or run package code.
  publish:
    needs: [prepare]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write   # create the Core tag
      packages: read    # prove the version is absent from GitHub Packages
      id-token: write   # npm trusted publishing
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PKG_NAMES: ${{ needs.prepare.outputs.pkg_names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm for trusted publishing
        run: |
          set -euo pipefail
          node -e "const [a,b]=process.versions.node.split('.').map(Number);if(a<22||(a===22&&b<14)){console.error('::error::Trusted publishing needs Node >= 22.14.0, found '+process.versions.node);process.exit(1)}"
          npm install --global --ignore-scripts "npm@$OIDC_NPM_VERSION" \
            --registry https://registry.npmjs.org
          [ "$(npm --version)" = "$OIDC_NPM_VERSION" ] || {
            echo "::error::npm $(npm --version) is active, expected $OIDC_NPM_VERSION"
            exit 1
          }

      - name: Fetch tags
        run: git fetch origin --tags

      - name: Download release tarballs
        if: needs.prepare.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: .release-tarballs

      # Trusted publishing leaves nothing to prove about npmjs write access
      # before the tag: OIDC does not authenticate `npm whoami` or
      # `npm access`, and no token exists to test. A missing or mismatched
      # trusted publisher (workflow filename, environment, allowed actions)
      # therefore fails at `npm publish`, after the immutable tag exists.
      # Fix the configuration on npmjs.com and dispatch the same version
      # again: tagged recovery publishes what is missing. What is still
      # proven here: the packed tarballs arrived, the version is absent from
      # both registries when the tag is, and the GitHub Packages token reads
      # its registry. Tag state is read live, so a re-run of this job after a
      # partial publish does not mistake its own packages for foreign ones.
      - name: Verify release credentials
        env:
          GPR_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PACKAGES_PUBLISHED: ${{ needs.prepare.outputs.published }}
        run: |
          set -euo pipefail
          if [ "$PACKAGES_PUBLISHED" != true ]; then
            for pkg in $PKG_NAMES; do
              base="${pkg#@}"
              test -f ".release-tarballs/${base//\//-}-$VERSION.tgz" || {
                echo "::error::Packed tarball for $pkg@$VERSION did not arrive from prepare"
                exit 1
              }
            done
          fi
          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            TAG_EXISTS=true
          fi
          GPR_NPMRC="$RUNNER_TEMP/github-packages-preflight.npmrc"
          trap 'rm -f "$GPR_NPMRC"' EXIT
          {
            echo "@aotter:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${GPR_TOKEN}"
            echo "always-auth=true"
          } > "$GPR_NPMRC"
          [ "$(npm config get @aotter:registry \
            --userconfig "$GPR_NPMRC" \
            --@aotter:registry=https://npm.pkg.github.com)" = https://npm.pkg.github.com ] || {
              echo "::error::Could not override the repository npmjs scope mapping for GitHub Packages"
              exit 1
            }
          assert_absent() {
            pkg="$1"
            registry="$2"
            label="$3"
            shift 3
            set +e
            output=$(npm view "$pkg@$VERSION" version "$@" \
              --registry "$registry" --@aotter:registry="$registry" 2>&1)
            status=$?
            set -e
            if [ "$status" = 0 ]; then
              echo "::error::$pkg@$VERSION already exists on $label without the Core tag"
              exit 1
            fi
            grep -Eq 'E404|404 Not Found' <<< "$output" || {
              echo "::error::Could not prove $pkg@$VERSION is absent from $label"
              exit 1
            }
          }
          if [ "$TAG_EXISTS" = false ]; then
            for pkg in $PKG_NAMES; do
              assert_absent "$pkg" https://registry.npmjs.org npmjs
              assert_absent "$pkg" https://npm.pkg.github.com 'GitHub Packages' \
                --userconfig "$GPR_NPMRC"
            done
          fi

      - name: Create immutable Core tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CORE_SHA: ${{ needs.prepare.outputs.core_sha }}
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          if [ -n "$TAG_SHA" ]; then
            [ "$TAG_SHA" = "$CORE_SHA" ] || {
              echo "::error::$TAG points to $TAG_SHA, not $CORE_SHA"
              exit 1
            }
            echo "$TAG already exists at $TAG_SHA; no-op."
          else
            git tag "$TAG" "$CORE_SHA"
            gh auth setup-git
            git push origin "$TAG"
          fi

      # No token: npm exchanges this job's OIDC identity for a publish
      # credential and attaches provenance. The tarball's repository.url must
      # be this repository.
      - name: Publish to npmjs
        run: |
          set -euo pipefail
          for pkg in $PKG_NAMES; do
            base="${pkg#@}"
            tgz=".release-tarballs/${base//\//-}-$VERSION.tgz"
            if npm view "$pkg@$VERSION" version \
              --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$pkg@$VERSION already exists on npmjs; skipping publish"
              continue
            fi
            npm publish "$tgz" \
              --registry https://registry.npmjs.org \
              --tag mantle-release \
              --access public
          done

      - name: Verify npm metadata
        # These reads are unauthenticated: trusted publishing does not
        # authenticate `npm view`. Publish sets public access, so the
        # packages are readable. A restricted package would 404 here and the
        # error below would blame propagation.
        run: |
          set -euo pipefail
          # A new version of an existing package is readable in seconds; a
          # package published under a brand new name took ten minutes at
          # v0.1.0-alpha.8. Budget for the slow case.
          for attempt in $(seq 40); do
            READY=1
            for p in $PKG_NAMES; do
              npm view "$p@$VERSION" dist.integrity --json --registry https://registry.npmjs.org | \
                node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{let v;try{v=JSON.parse(s)}catch{};if(typeof v!=='string'||!v.startsWith('sha512-'))process.exit(1)})" || READY=0
            done
            if [ "$READY" = 1 ]; then
              exit 0
            fi
            echo "npm integrity metadata not ready yet (attempt $attempt); retrying"
            sleep 15
          done
          echo "::error::npm integrity metadata did not become ready"
          exit 1

      - name: Verify immutable npm artifacts
        if: needs.prepare.outputs.published != 'true'
        run: |
          set -euo pipefail
          for pkg in $PKG_NAMES; do
            base="${pkg#@}"
            tgz=".release-tarballs/${base//\//-}-$VERSION.tgz"
            remote_dir=$(mktemp -d)
            npm pack "$pkg@$VERSION" --ignore-scripts --silent \
              --pack-destination "$remote_dir" \
              --registry https://registry.npmjs.org >/dev/null
            node scripts/verify-release-artifact.mjs \
              "$tgz" "$remote_dir/$(basename "$tgz")"
            rm -rf "$remote_dir"
            npm view "$pkg@$VERSION" dependencies --json --registry https://registry.npmjs.org | \
              node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const deps=s.trim()?JSON.parse(s):{};if(Object.values(deps).some(v=>String(v).startsWith('workspace:')))process.exit(1)})" || {
                echo "::error::$pkg@$VERSION leaked a workspace dependency"
                exit 1
              }
          done

  # Node's bundled npm and the job token, as before trusted publishing; no OIDC identity.
  mirror:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # mirror SDK packages to GitHub Packages
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PKG_NAMES: ${{ needs.prepare.outputs.pkg_names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Download release tarballs
        if: needs.prepare.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: .release-tarballs

      - name: Mirror to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_PUBLISHED: ${{ needs.prepare.outputs.published }}
        run: |
          set -euo pipefail
          GPR_NPMRC="$RUNNER_TEMP/github-packages.npmrc"
          trap 'rm -f "$GPR_NPMRC"' EXIT
          {
            echo "@aotter:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > "$GPR_NPMRC"
          gpr_npm() {
            npm --userconfig "$GPR_NPMRC" \
              --registry https://npm.pkg.github.com \
              --@aotter:registry=https://npm.pkg.github.com "$@"
          }
          mkdir -p .github-package-tarballs

          for pkg in $PKG_NAMES; do
            base="${pkg#@}"
            tgz=".release-tarballs/${base//\//-}-$VERSION.tgz"
            if [ "$PACKAGES_PUBLISHED" = true ]; then
              if gpr_npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
                echo "$pkg@$VERSION already exists on GitHub Packages; skipping mirror"
                continue
              fi
              echo "::error::$pkg@$VERSION is missing on GitHub Packages; tagged recovery will not pack a replacement from the controller tip"
              exit 1
            fi
            work="$(mktemp -d)"
            tar -xzf "$tgz" -C "$work"
            node -e "const fs=require('node:fs'); const path=process.argv[1]; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.publishConfig={...(pkg.publishConfig||{}), registry:'https://npm.pkg.github.com'}; fs.writeFileSync(path, JSON.stringify(pkg,null,2)+'\n');" "$work/package/package.json"
            (
              cd "$work/package"
              npm pack --pack-destination "$GITHUB_WORKSPACE/.github-package-tarballs" >/dev/null
            )
            rm -rf "$work"
            gpr_tgz="$GITHUB_WORKSPACE/.github-package-tarballs/$(basename "$tgz")"
            if gpr_npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION already exists on GitHub Packages; skipping publish"
            else
              gpr_npm publish "$gpr_tgz" --tag mantle-release \
                --access public
            fi
            remote_work=$(mktemp -d)
            gpr_npm pack "$pkg@$VERSION" --ignore-scripts --silent \
              --pack-destination "$remote_work" >/dev/null
            node scripts/verify-release-artifact.mjs \
              "$gpr_tgz" "$remote_work/$(basename "$gpr_tgz")"
            rm -rf "$remote_work"
          done

  # Installs and runs dependency code, so it holds no write permission and no OIDC identity.
  consumer:
    needs: [prepare, mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PKG_NAMES: ${{ needs.prepare.outputs.pkg_names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.prepare.outputs.published != 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.prepare.outputs.published != 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.prepare.outputs.published != 'true' && needs.prepare.outputs.tag_exists != 'true'
        with:
          bun-version: 1.3.14

      - name: Install for the Worker gate
        if: needs.prepare.outputs.published != 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify public-registry Core in the reference Worker
        env:
          PACKAGES_PUBLISHED: ${{ needs.prepare.outputs.published }}
        run: |
          set -euo pipefail
          if [ "$PACKAGES_PUBLISHED" = true ]; then
            echo "Tagged recovery: all packages already exist on npmjs at $VERSION; skipping the public-registry Worker gate."
            exit 0
          fi
          node scripts/check-worker-consumer.mjs --registry "$VERSION"

  # OIDC job. Nothing here may install dependencies or run package code.
  promote:
    needs: [prepare, consumer]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (dist-tag)
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PKG_NAMES: ${{ needs.prepare.outputs.pkg_names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm for trusted publishing
        run: |
          set -euo pipefail
          node -e "const [a,b]=process.versions.node.split('.').map(Number);if(a<22||(a===22&&b<14)){console.error('::error::Trusted publishing needs Node >= 22.14.0, found '+process.versions.node);process.exit(1)}"
          npm install --global --ignore-scripts "npm@$OIDC_NPM_VERSION" \
            --registry https://registry.npmjs.org
          [ "$(npm --version)" = "$OIDC_NPM_VERSION" ] || {
            echo "::error::npm $(npm --version) is active, expected $OIDC_NPM_VERSION"
            exit 1
          }

      - name: Fetch tags
        run: git fetch origin --tags

      - name: Promote npmjs channel tags
        # No token: npm exchanges this job's OIDC identity for `dist-tag add`.
        # The trusted publisher must have "Allow npm dist-tag" enabled. Reading
        # the tags of a public package needs no authentication.
        env:
          CORE_SHA: ${{ needs.prepare.outputs.core_sha }}
        run: |
          set -euo pipefail

          promote() {
            pkg="$1"
            tag="$2"
            current=$(npm view "$pkg" "dist-tags.$tag" \
              --registry https://registry.npmjs.org)
            if [ "$current" = "$VERSION" ]; then
              echo "$pkg@$VERSION already owns npmjs dist-tag $tag; no-op."
              return
            fi
            if [ -n "$current" ]; then
              decision=$(node scripts/release-tag-order.mjs "$CORE_SHA" "$current")
              [ "$decision" != preserve ] || {
                echo "Preserving newer npmjs dist-tag $pkg@$tag at $current."
                return
              }
            fi
            npm dist-tag add "$pkg@$VERSION" "$tag" \
              --registry https://registry.npmjs.org
          }

          # Publish attaches mantle-release so publication does not move a
          # public channel. This step promotes every package onto alpha,
          # beta, rc, or latest only. mantle-release stays pointed at the
          # last published candidate.

          for pkg in $PKG_NAMES; do
            for channel in $(node scripts/release-tag-order.mjs --channels "$VERSION"); do
              promote "$pkg" "$channel"
            done
          done

  release:
    needs: [prepare, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # move GitHub Packages channel dist-tags
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PKG_NAMES: ${{ needs.prepare.outputs.pkg_names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Fetch tags
        run: git fetch origin --tags

      - name: Promote GitHub Packages channel tags
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          CORE_SHA: ${{ needs.prepare.outputs.core_sha }}
        run: |
          set -euo pipefail
          NPMRC="$RUNNER_TEMP/github-packages-promote.npmrc"
          trap 'rm -f "$NPMRC"' EXIT
          {
            echo "@aotter:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > "$NPMRC"
          gpr_npm() {
            npm --userconfig "$NPMRC" \
              --registry https://npm.pkg.github.com \
              --@aotter:registry=https://npm.pkg.github.com "$@"
          }

          promote() {
            pkg="$1"
            tag="$2"
            current=$(gpr_npm view "$pkg" "dist-tags.$tag")
            if [ "$current" = "$VERSION" ]; then
              echo "$pkg@$VERSION already owns GitHub Packages dist-tag $tag; no-op."
              return
            fi
            if [ -n "$current" ]; then
              decision=$(node scripts/release-tag-order.mjs "$CORE_SHA" "$current")
              [ "$decision" != preserve ] || {
                echo "Preserving newer GitHub Packages dist-tag $pkg@$tag at $current."
                return
              }
            fi
            gpr_npm dist-tag add "$pkg@$VERSION" "$tag"
          }

          # Same boundary as npmjs: promote every package's public channel
          # only. mantle-release stays pointed at the last published
          # candidate.

          for pkg in $PKG_NAMES; do
            for channel in $(node scripts/release-tag-order.mjs --channels "$VERSION"); do
              promote "$pkg" "$channel"
            done
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; no-op."
          elif [[ "$NPM_TAG" = latest ]]; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          else
            gh release create "$TAG" --generate-notes --title "$TAG" --prerelease
          fi

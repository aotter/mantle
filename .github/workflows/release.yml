# Single release controller for aotter/mantle#559.
#
# Manually dispatched from the merged release commit. It owns the order:
#
#   source + exact packed consumer -> Core tag -> verified candidate registries ->
#   public-registry consumer -> public channels -> release
#
# Duplicate dispatches verify the same immutable state and skip existing
# registry/tag/release mutations. No downstream repository is mutated.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v'
        required: true
        type: string

concurrency:
  group: release-controller
  cancel-in-progress: false

permissions:
  contents: write   # create Core tag and GitHub release
  packages: write   # mirror SDK packages to GitHub Packages
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Single source of truth for the ten public packages, in dependency order.
    # Names are read from these package.json files during packing.
    env:
      PKG_DIRS: >-
        packages/mantle-spec
        packages/mantle-admin-ui
        packages/mantle-runtime
        packages/adapters/indexeddb
        packages/mantle-web
        packages/mantle-admin
        packages/adapters/bun
        packages/adapters/vercel
        packages/adapters/cloudflare
        packages/mantle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Resolve release state
        id: ver
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || {
            echo "::error::Invalid version: $VERSION"
            exit 1
          }
          TAG="v$VERSION"
          CORE_SHA=$(git rev-parse HEAD)
          SOURCE_BRANCH=main
          [[ "$VERSION" =~ -alpha(\.|$) ]] && SOURCE_BRANCH=develop
          git fetch origin --tags
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$CORE_SHA" ]; then
            echo "::error::$TAG already points to $TAG_SHA, not controller commit $CORE_SHA"
            exit 1
          fi
          if [ -z "$TAG_SHA" ]; then
            git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
            SOURCE_SHA=$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")
            [ "$CORE_SHA" = "$SOURCE_SHA" ] || {
              echo "::error::Untagged release commit $CORE_SHA is not the current $SOURCE_BRANCH tip $SOURCE_SHA"
              exit 1
            }
          fi
          PULLS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CORE_SHA/pulls")
          MERGED_PR_COUNT=$(jq \
            --arg base "$SOURCE_BRANCH" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$CORE_SHA" \
            '[.[] | select(.merged_at != null and .base.ref == $base and .head.repo.full_name == $repo and .merge_commit_sha == $sha)] | length' \
            <<< "$PULLS")
          [ "$MERGED_PR_COUNT" = 1 ] || {
            echo "::error::Release commit $CORE_SHA is not one canonical merged PR commit on $SOURCE_BRANCH"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "core_sha=$CORE_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG_SHA" ]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          CHANNELS=$(node scripts/release-tag-order.mjs --channels "$VERSION")
          NPM_TAG=${CHANNELS%% *}
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Core source
        run: pnpm check

      - name: Verify package, plugin, and marketplace versions match ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { globSync, readFileSync } from 'node:fs';
            const expected = '${{ steps.ver.outputs.version }}';
            let failed = false;
            const packagePaths = [
              'package.json',
              ...globSync('packages/**/package.json', {
                exclude: ['packages/**/node_modules/**'],
              }),
            ];
            for (const path of packagePaths) {
              const pkg = JSON.parse(readFileSync(path, 'utf8'));
              if (pkg.version !== expected) {
                console.error(path + ' version ' + pkg.version + ' does not match tag version ' + expected);
                failed = true;
              }
            }
            for (const path of [
              '.codex-plugin/plugin.json',
              '.claude-plugin/plugin.json',
              '.copilot-plugin/plugin.json',
              '.cursor-plugin/plugin.json',
            ]) {
              const plugin = JSON.parse(readFileSync(path, 'utf8'));
              if (plugin.version !== expected) {
                console.error(path + ' version ' + plugin.version + ' does not match tag version ' + expected);
                failed = true;
              }
            }
            const marketplacePath = '.agents/plugins/marketplace.json';
            const marketplace = JSON.parse(readFileSync(marketplacePath, 'utf8'));
            const marketplaceRef = marketplace.plugins?.[0]?.source?.ref;
            const expectedRef = 'v' + expected;
            if (marketplaceRef !== expectedRef) {
              console.error(marketplacePath + ' ref ' + marketplaceRef + ' does not match tag ' + expectedRef);
              failed = true;
            }
            if (failed) process.exit(1);
          "

      - name: Pack release tarballs
        run: |
          set -euo pipefail
          node scripts/verify-release-artifact.mjs --self-test
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p .release-tarballs
          PKG_NAMES=""
          for dir in $PKG_DIRS; do
            pnpm -C "$dir" pack --pack-destination "$PWD/.release-tarballs"
            name=$(node -p "require('./$dir/package.json').name")
            PKG_NAMES="${PKG_NAMES:+$PKG_NAMES }$name"
          done
          echo "PKG_NAMES=$PKG_NAMES" >> "$GITHUB_ENV"

          # Version lockstep: pnpm pack names tarballs <name>-<version>.tgz,
          # so a package whose version drifted from the tag fails here.
          for pkg in $PKG_NAMES; do
            base="${pkg#@}"
            test -f ".release-tarballs/${base//\//-}-$VERSION.tgz"
          done

      - name: Verify release credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GPR_TOKEN: ${{ github.token }}
          TAG_EXISTS: ${{ steps.ver.outputs.tag_exists }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "${NODE_AUTH_TOKEN:-}" ] || {
            echo "::error::NPM_TOKEN is required before creating an immutable tag"
            exit 1
          }
          NPMRC="$RUNNER_TEMP/npmjs-preflight.npmrc"
          GPR_NPMRC="$RUNNER_TEMP/github-packages-preflight.npmrc"
          trap 'rm -f "$NPMRC" "$GPR_NPMRC"' EXIT
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > "$NPMRC"
          {
            echo "@aotter:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${GPR_TOKEN}"
            echo "always-auth=true"
          } > "$GPR_NPMRC"
          [ "$(npm config get @aotter:registry \
            --userconfig "$GPR_NPMRC" \
            --@aotter:registry=https://npm.pkg.github.com)" = https://npm.pkg.github.com ] || {
              echo "::error::Could not override the repository npmjs scope mapping for GitHub Packages"
              exit 1
            }
          npm whoami --userconfig "$NPMRC" --registry https://registry.npmjs.org >/dev/null
          # `npm access list packages` only reports packages that already
          # exist in the scope, so a first publish is absent rather than
          # denied. Scope-level write cannot be proven from this listing;
          # `npm publish` is the boundary that rejects a token without it.
          npm access list packages @aotter --json --userconfig "$NPMRC" \
            --registry https://registry.npmjs.org | \
            node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const access=JSON.parse(s);const denied=process.argv.slice(1).filter(p=>p in access&&access[p]!=='read-write');if(denied.length){console.error('NPM_TOKEN lacks read-write access: '+denied.join(', '));process.exit(1)}})" \
            $PKG_NAMES
          assert_absent() {
            pkg="$1"
            npmrc="$2"
            registry="$3"
            label="$4"
            set +e
            output=$(npm view "$pkg@$VERSION" version --userconfig "$npmrc" \
              --registry "$registry" --@aotter:registry="$registry" 2>&1)
            status=$?
            set -e
            if [ "$status" = 0 ]; then
              echo "::error::$pkg@$VERSION already exists on $label without the Core tag"
              exit 1
            fi
            grep -Eq 'E404|404 Not Found' <<< "$output" || {
              echo "::error::Could not prove $pkg@$VERSION is absent from $label"
              exit 1
            }
          }
          if [ "$TAG_EXISTS" = false ]; then
            for pkg in $PKG_NAMES; do
              assert_absent "$pkg" "$NPMRC" https://registry.npmjs.org npmjs
              assert_absent "$pkg" "$GPR_NPMRC" https://npm.pkg.github.com 'GitHub Packages'
            done
          fi

      - name: Create immutable Core tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          CORE_SHA: ${{ steps.ver.outputs.core_sha }}
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          if [ -n "$TAG_SHA" ]; then
            [ "$TAG_SHA" = "$CORE_SHA" ] || {
              echo "::error::$TAG points to $TAG_SHA, not $CORE_SHA"
              exit 1
            }
            echo "$TAG already exists at $TAG_SHA; no-op."
          else
            git tag "$TAG" "$CORE_SHA"
            gh auth setup-git
            git push origin "$TAG"
          fi

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NPMJS_NPMRC="$RUNNER_TEMP/npmjs.npmrc"
          trap 'rm -f "$NPMJS_NPMRC"' EXIT
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > "$NPMJS_NPMRC"
          npm whoami --userconfig "$NPMJS_NPMRC" --registry https://registry.npmjs.org >/dev/null
          VERSION="${{ steps.ver.outputs.version }}"

          for pkg in $PKG_NAMES; do
            base="${pkg#@}"
            tgz=".release-tarballs/${base//\//-}-$VERSION.tgz"
            if npm view "$pkg@$VERSION" version \
              --userconfig "$NPMJS_NPMRC" \
              --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$pkg@$VERSION already exists on npmjs; skipping publish"
              continue
            fi
            npm publish "$tgz" \
              --userconfig "$NPMJS_NPMRC" \
              --registry https://registry.npmjs.org \
              --tag mantle-release \
              --access public
          done

      - name: Verify npm metadata
        env:
          # Unauthenticated, a restricted package would 404 here and the error
          # below would blame propagation.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          # A new version of an existing package is readable in seconds; a
          # package published under a brand new name took ten minutes at
          # v0.1.0-alpha.8. Budget for the slow case.
          for attempt in $(seq 40); do
            READY=1
            for p in $PKG_NAMES; do
              npm view "$p@$VERSION" dist.integrity --json --registry https://registry.npmjs.org | \
                node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{let v;try{v=JSON.parse(s)}catch{};if(typeof v!=='string'||!v.startsWith('sha512-'))process.exit(1)})" || READY=0
            done
            if [ "$READY" = 1 ]; then
              exit 0
            fi
            echo "npm integrity metadata not ready yet (attempt $attempt); retrying"
            sleep 15
          done
          echo "::error::npm integrity metadata did not become ready"
          exit 1

      - name: Verify immutable npm artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          for pkg in $PKG_NAMES; do
            base="${pkg#@}"
            tgz=".release-tarballs/${base//\//-}-$VERSION.tgz"
            remote_dir=$(mktemp -d)
            npm pack "$pkg@$VERSION" --ignore-scripts --silent \
              --pack-destination "$remote_dir" \
              --registry https://registry.npmjs.org >/dev/null
            node scripts/verify-release-artifact.mjs \
              "$tgz" "$remote_dir/$(basename "$tgz")"
            rm -rf "$remote_dir"
            npm view "$pkg@$VERSION" dependencies --json --registry https://registry.npmjs.org | \
              node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const deps=s.trim()?JSON.parse(s):{};if(Object.values(deps).some(v=>String(v).startsWith('workspace:')))process.exit(1)})" || {
                echo "::error::$pkg@$VERSION leaked a workspace dependency"
                exit 1
              }
          done

      - name: Mirror to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GPR_NPMRC="$RUNNER_TEMP/github-packages.npmrc"
          trap 'rm -f "$GPR_NPMRC"' EXIT
          {
            echo "@aotter:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > "$GPR_NPMRC"
          gpr_npm() {
            npm --userconfig "$GPR_NPMRC" \
              --registry https://npm.pkg.github.com \
              --@aotter:registry=https://npm.pkg.github.com "$@"
          }
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p .github-package-tarballs

          for pkg in $PKG_NAMES; do
            base="${pkg#@}"
            tgz=".release-tarballs/${base//\//-}-$VERSION.tgz"
            work="$(mktemp -d)"
            tar -xzf "$tgz" -C "$work"
            node -e "const fs=require('node:fs'); const path=process.argv[1]; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.publishConfig={...(pkg.publishConfig||{}), registry:'https://npm.pkg.github.com'}; fs.writeFileSync(path, JSON.stringify(pkg,null,2)+'\n');" "$work/package/package.json"
            (
              cd "$work/package"
              npm pack --pack-destination "$GITHUB_WORKSPACE/.github-package-tarballs" >/dev/null
            )
            rm -rf "$work"
            gpr_tgz="$GITHUB_WORKSPACE/.github-package-tarballs/$(basename "$tgz")"
            if gpr_npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION already exists on GitHub Packages; skipping publish"
            else
              gpr_npm publish "$gpr_tgz" --tag mantle-release \
                --access public
            fi
            remote_work=$(mktemp -d)
            gpr_npm pack "$pkg@$VERSION" --ignore-scripts --silent \
              --pack-destination "$remote_work" >/dev/null
            node scripts/verify-release-artifact.mjs \
              "$gpr_tgz" "$remote_work/$(basename "$gpr_tgz")"
            rm -rf "$remote_work"
          done

      - name: Verify public-registry Core in the reference Worker
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/check-worker-consumer.mjs --registry "$VERSION"

      - name: Promote npmjs channel tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CORE_SHA: ${{ steps.ver.outputs.core_sha }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          NPMRC="$RUNNER_TEMP/npmjs-promote.npmrc"
          trap 'rm -f "$NPMRC"' EXIT
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > "$NPMRC"

          promote() {
            pkg="$1"
            tag="$2"
            current=$(npm view "$pkg" "dist-tags.$tag" --userconfig "$NPMRC" \
              --registry https://registry.npmjs.org)
            if [ "$current" = "$VERSION" ]; then
              echo "$pkg@$VERSION already owns npmjs dist-tag $tag; no-op."
              return
            fi
            if [ -n "$current" ]; then
              decision=$(node scripts/release-tag-order.mjs "$CORE_SHA" "$current")
              [ "$decision" != preserve ] || {
                echo "Preserving newer npmjs dist-tag $pkg@$tag at $current."
                return
              }
            fi
            npm dist-tag add "$pkg@$VERSION" "$tag" --userconfig "$NPMRC" \
              --registry https://registry.npmjs.org
          }

          for pkg in $PKG_NAMES; do
            for channel in $(node scripts/release-tag-order.mjs --channels "$VERSION"); do
              promote "$pkg" "$channel"
            done
          done

      - name: Promote GitHub Packages channel tags
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          CORE_SHA: ${{ steps.ver.outputs.core_sha }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          NPMRC="$RUNNER_TEMP/github-packages-promote.npmrc"
          trap 'rm -f "$NPMRC"' EXIT
          {
            echo "@aotter:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > "$NPMRC"
          gpr_npm() {
            npm --userconfig "$NPMRC" \
              --registry https://npm.pkg.github.com \
              --@aotter:registry=https://npm.pkg.github.com "$@"
          }

          promote() {
            pkg="$1"
            tag="$2"
            current=$(gpr_npm view "$pkg" "dist-tags.$tag")
            if [ "$current" = "$VERSION" ]; then
              echo "$pkg@$VERSION already owns GitHub Packages dist-tag $tag; no-op."
              return
            fi
            if [ -n "$current" ]; then
              decision=$(node scripts/release-tag-order.mjs "$CORE_SHA" "$current")
              [ "$decision" != preserve ] || {
                echo "Preserving newer GitHub Packages dist-tag $pkg@$tag at $current."
                return
              }
            fi
            gpr_npm dist-tag add "$pkg@$VERSION" "$tag"
          }

          for pkg in $PKG_NAMES; do
            for channel in $(node scripts/release-tag-order.mjs --channels "$VERSION"); do
              promote "$pkg" "$channel"
            done
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; no-op."
          elif [[ "${{ steps.ver.outputs.npm_tag }}" = latest ]]; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          else
            gh release create "$TAG" --generate-notes --title "$TAG" --prerelease
          fi

name: CI

# ponytail: PR-only. The merge ref was already tested; push runs repeated it.
# Drafts skip until ready_for_review — agent PRs iterate in draft.
# Every base: a release line (0.2.x) and a PR stacked on another PR are merged as well, so they are tested as well.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same ref. PR pushes that arrive in
# rapid succession only spend CI on the latest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deterministic checks required before merge.
  lint:
    name: Typecheck + tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the PostgreSQL dialect's tests (test/postgres) run against this server; without MANTLE_PG_URL they skip
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: mantle, POSTGRES_PASSWORD: mantle, POSTGRES_DB: mantle }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MANTLE_PG_URL: postgres://mantle:mantle@localhost:5432/mantle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm build

      - name: Check package boundaries
        run: pnpm run check:boundaries

      - name: Check skill disclosure audit
        run: pnpm run check:skills

      - name: Check generated plugin manifests
        run: pnpm run check:plugin-manifests

      - name: Check release controller
        run: pnpm run check:release

      - name: Compile the documented examples
        run: pnpm run check:doc-examples

      - name: Typecheck workspace
        run: pnpm typecheck

      - run: pnpm test

      # #1379: the same PostgreSQL suites over node-postgres pipeline mode
      - name: PostgreSQL suites, pipelined
        run: pnpm --filter @aotter/mantle exec vitest run test/postgres
        env:
          MANTLE_PG_PIPELINE: "1"

      - name: Native Bun host conformance
        run: pnpm --filter @aotter/mantle test:bun

      - name: Check packed-consumer provenance rejection
        run: node scripts/check-packed-consumer.mjs --self-test

      - name: Test packed Core in the reference Worker
        run: pnpm check:worker-consumer

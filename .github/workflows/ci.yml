name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref. PR pushes that arrive in
# rapid succession only spend CI on the latest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks that fail the PR quickly. Runs on every push + PR.
  lint:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dist
        # Vitest tests for cloudflare import runtime/admin UI via dist/,
        # so build before test.
        run: pnpm build

      - name: Check package boundaries
        run: pnpm run check:boundaries

      - name: Typecheck workspace
        # Starter typecheck/validate moved out with PR #108 (blank
        # migrated to aotter/mantle-starters); run there now.
        run: pnpm typecheck

      - run: pnpm test

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref. PR pushes that arrive in
# rapid succession only spend CI on the latest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks that fail the PR quickly. Runs on every push + PR.
  lint:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dist
        # Vitest tests for cloudflare import runtime/admin UI via dist/,
        # so build before test.
        run: pnpm build

      - name: Check package boundaries
        run: pnpm run check:boundaries

      - name: Typecheck workspace
        # Starter typecheck/validate moved out with PR #108 (blank
        # migrated to aotter/mantle-starters); run there now.
        run: pnpm typecheck

      - run: pnpm test

      - uses: actions/checkout@v7.0.0
        with:
          repository: aotter/mantle-starters
          ref: develop
          path: .downstream/mantle-starters
          fetch-depth: 0

      - name: Use a paired starters branch when one exists
        working-directory: .downstream/mantle-starters
        env:
          PAIRED_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$PAIRED_REF" ] && git ls-remote --exit-code origin "refs/heads/$PAIRED_REF" >/dev/null 2>&1; then
            git fetch --depth=1 origin "refs/heads/$PAIRED_REF"
            git checkout --detach FETCH_HEAD
          fi

      - name: Validate exact packed SDK in external starter consumer
        shell: bash
        run: |
          node .downstream/mantle-starters/scripts/build-provision-bundle.mjs --check
          if node -e 'process.exit(require("./.downstream/mantle-starters/package.json").scripts?.["check:packed"] ? 0 : 1)'; then
            node scripts/run-packed-downstream.mjs --project .downstream/mantle-starters -- pnpm check:packed
          else
            node scripts/run-packed-downstream.mjs --project .downstream/mantle-starters -- pnpm --dir blank check
          fi

      - name: Keep the low-level Cloudflare composition escape hatch usable
        run: node scripts/run-packed-downstream.mjs --package-project fixtures/low-level-worker -- pnpm check

      - name: Preserve alpha.63 project ownership through the Core CLI bridge
        run: node scripts/check-alpha63-upgrade.mjs --starters .downstream/mantle-starters

      - name: Check crowded D1 and public cache paths
        run: pnpm bench:wrangler

name: CI

# ponytail: CI gates `main` only. A PR into `main` runs the whole suite for every author (full-checks.yml); a PR into
# `develop` merges on a local `pnpm check` (exit code 0) plus review and is fixed forward.
# The one exception is here: Dependabot PRs into `develop`. dependabot-automerge.yml approves and queues patch and
# digest bumps, and nobody ran those locally, so these light jobs are what the auto-merge waits for.
# For every other author the jobs skip, and a skipped required check counts as passing.
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same ref. PR pushes that arrive in
# rapid succession only spend CI on the latest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep the existing required status while both parallel jobs must pass.
  lint:
    name: Typecheck + tests
    needs: [typecheck, tests]
    if: ${{ always() && !github.event.pull_request.draft && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both jobs
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          TESTS: ${{ needs.tests.result }}
        run: test "$TYPECHECK" = success && test "$TESTS" = success

  typecheck:
    name: Typecheck + gates
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm build

      - run: pnpm run check:format
      - name: Check package boundaries
        run: pnpm run check:boundaries

      - name: Check skill disclosure audit
        run: pnpm run check:skills

      - name: Check generated plugin manifests
        run: pnpm run check:plugin-manifests

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Check startup graphs and budgets
        run: pnpm check:startup

      - name: Self-test release scripts and packed-consumer provenance
        run: pnpm run check:release && node scripts/check-packed-consumer.mjs --self-test

  tests:
    name: Package tests
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm build

      - name: Test packages concurrently
        run: pnpm test

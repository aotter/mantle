name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref. PR pushes that arrive in
# rapid succession only spend CI on the latest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks that fail the PR quickly. Runs on every push + PR.
  lint:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dist
        # Vitest tests for cloudflare import runtime/admin UI via dist/,
        # so build before test.
        run: pnpm build

      - name: Check package boundaries
        run: pnpm run check:boundaries

      - name: Typecheck workspace
        # Starter typecheck/validate moved out with PR #108 (blank
        # migrated to aotter/mantle-starters); run there now.
        run: pnpm typecheck

      - run: pnpm test

      - name: Check crowded D1 and public cache paths
        run: pnpm bench:wrangler

      - name: Check packed-consumer provenance rejection
        run: node scripts/check-packed-consumer.mjs --self-test

      - name: Check out the exact Starter consumer
        uses: actions/checkout@v7.0.0
        with:
          repository: aotter/mantle-starters
          ref: 67d3854a78910cb111d4c5a02bf7b871b3c7aad2
          path: .packed-consumer/mantle-starters
          persist-credentials: false

      - name: Test packed Core in the exact Starter consumer
        # Mirror the downstream bump controller: project skills from the new
        # package before rebuilding and checking the immutable Starter source.
        run: >-
          node scripts/check-packed-consumer.mjs
          --project .packed-consumer/mantle-starters --
          sh -euc 'pnpm --dir blank exec mantle skills;
          pnpm build:provision-bundle;
          pnpm check:packed'

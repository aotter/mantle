name: Proposal
description: ADR-lite proposal for a concrete decision.
title: "[Proposal] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: boundary
    attributes:
      label: Core's boundary
      description: "Many requests are the application's to solve with a documented pattern: [what Core does, and what it does not](https://github.com/aotter/mantle/blob/develop/docs/handbook/concepts/core-boundary.md) (also `mantle help core-boundary`)."
      options:
        - label: I read the boundary page and its "what Core does not do" table. This request is not on it, or I am supplying the evidence its decision says would reopen it.
          required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What pressure forces a decision now?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
      description: State the decision directly.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else was considered?
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: Positive and negative consequences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope of impact
      description: Packages, docs, Skills, runtime behavior, auth, storage, or public API surfaces affected. Legacy mantle-starters work only when the change is retirement or migration notes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence from application code
      description: "A reduced excerpt of the application code that works around this today (only what shows which Core behaviour it depends on), marked `drop when aotter/mantle#<issue>`, and why the documented patterns do not fit. Do not include secrets, customer names or private repository links. Write \"none\" only for a defect in an existing contract."
    validations:
      required: true
  - type: textarea
    id: boundary_tests
    attributes:
      label: Which boundary tests it passes
      description: "For each of the four tests on the boundary page: must it be enforced where SQL is compiled, or is it a closed value the generator must know? Does it avoid Core-owned storage and runtime DDL? Does it avoid coupling Core to one auth plugin's tables, and work for an application behind a gateway? What real application code shows the need?"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      description: Use area:starters only for retired mantle-starters source or migration notes.
      options:
        - area:runtime
        - area:spec
        - area:cf
        - area:skills
        - area:admin-ui
        - area:docs
        - area:ci
        - area:adapter
        - unknown
        - area:starters
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Gates
      options:
        - label: This should become a full ADR before implementation.
        - label: This touches manifest grammar or closed enums.
        - label: This affects a security or trust boundary.
